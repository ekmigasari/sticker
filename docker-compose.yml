services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: xmigas
      POSTGRES_PASSWORD: xmigas
      POSTGRES_DB: xmigas
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

volumes:
  postgres:
  minio:
